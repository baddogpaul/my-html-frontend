<html>
<head>
  <title>Base44 Headless Wrecker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <pre id="out">Loading…</pre>

  <h1 id="title">Loading...big poo sticks</h1>
  <div id="content"></div>
<script>
  // ✅ FULL Base44 App ID (important)
  const APP_ID = "697f9674e6e01fbb0528e450";

  // ✅ Entity name must match Base44 exactly (case-sensitive)
  const ENTITY = "Content";

  // ✅ Correct Base44 read endpoint
  const ENDPOINT = `https://app.base44.com/api/apps/${APP_ID}/entities/${ENTITY}`;

  async function loadContent() {
    const res = await fetch(ENDPOINT);

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();

    // Base44 usually returns { items: [...] }
    const items = data.items || [];
    const first = items[0];

    document.getElementById("out").textContent =
      JSON.stringify(data, null, 2);

    document.getElementById("title").textContent =
      first?.title || "No title found";

    document.getElementById("content").innerHTML =
      first?.text || "";
  }

  loadContent().catch(err => {
    document.getElementById("out").textContent =
      "Error: " + err.message;
  });
</script>


  
</body>
</html>
