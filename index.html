<html>
<head>
  <title>Base44 Headless Wrecker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <pre id="out">Loading…</pre>

  <h1 id="title">Loading...big CHANGES</h1>
  <div id="content"></div>
<script>
  // ===============================
  // Base44 → HTML live connection
  // ===============================

  const APP_ID = "697f9674e6e01fbb0528e450";
  const ENTITY = "Content";

  const ENDPOINT =
    `https://app.base44.com/api/apps/${APP_ID}/entities/${ENTITY}`;

  async function loadContent() {
    try {
      const res = await fetch(ENDPOINT);

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const data = await res.json();

      // Base44 returns an array directly
      const items = Array.isArray(data)
        ? data
        : data.items || [];

      const first = items.find(i => i.published === true);

      // debug output
      document.getElementById("out").textContent =
        JSON.stringify(data, null, 2);

      // render content
      document.getElementById("title").textContent =
        first?.title || "No title found";

      document.getElementById("content").innerHTML =
        first?.text || "";
    }
    catch (err) {
      document.getElementById("out").textContent =
        "ERROR: " + err.message;
    }
  }

  loadContent();
</script>


  <p>llllP</p>

  
</body>
</html>
